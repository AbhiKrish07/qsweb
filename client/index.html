    <!-- Quiet Studio Architectural Reveal Curtain Styles (Zero FOUC, High-Craft Site Reveal) -->
    <style id="qs-curtain-styles">
      #qs-reveal-curtain {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .qs-curtain-panel {
        position: absolute;
        left: 0;
        right: 0;
        height: 50.5vh;
        background: #0d0d0c;
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }
      .qs-curtain-panel--top {
        top: 0;
        transform-origin: top center;
        border-bottom: 1px solid rgba(255, 90, 31, 0.25);
      }
      .qs-curtain-panel--bottom {
        bottom: 0;
        transform-origin: bottom center;
        border-top: 1px solid rgba(255, 90, 31, 0.25);
      }
      .qs-curtain-core {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: #f4f1ea;
        padding: 24px;
        transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .qs-curtain-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .qs-curtain-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff5a1f;
        box-shadow: 0 0 16px rgba(255, 90, 31, 0.8);
        animation: qs-dot-pulse 1.6s ease-in-out infinite;
      }
      .qs-curtain-title {
        font-family: "Cabinet Grotesk", "Space Grotesk", -apple-system, sans-serif;
        font-size: clamp(22px, 3.4vw, 32px);
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: lowercase;
        color: #ffffff;
      }
      .qs-curtain-period {
        color: #ff5a1f;
      }
      .qs-curtain-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .qs-curtain-loader-track {
        width: 180px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 12px;
      }
      .qs-curtain-loader-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(90deg, #ff5a1f, #ff844b);
        transform: scaleX(0);
        transform-origin: left;
        animation: qs-beam-load 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .qs-curtain-status {
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.12em;
        color: #ff5a1f;
        text-transform: uppercase;
      }
      @keyframes qs-dot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.75; }
      }
      @keyframes qs-beam-load {
        0% { transform: scaleX(0); }
        45% { transform: scaleX(0.65); }
        100% { transform: scaleX(1); }
      }
      /* When revealed */
      #qs-reveal-curtain.is-revealed .qs-curtain-panel--top {
        transform: translateY(-100%);
      }
      #qs-reveal-curtain.is-revealed .qs-curtain-panel--bottom {
        transform: translateY(100%);
      }
      #qs-reveal-curtain.is-revealed .qs-curtain-core {
        opacity: 0;
        transform: scale(0.96) translateY(-10px);
      }
    </style>

    <!-- Preload & Link Core Agency Stylesheets to eliminate FOUC (Flash of Unstyled Content) -->
    <link rel="preload" href="/assets/css/bitwip.css" as="style" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem("quiet-studio-theme");
          var isDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }

          var savedMode = localStorage.getItem("quiet-studio-mode");
          if (savedMode === "human") {
            document.documentElement.setAttribute("data-studio-mode", "human");
            var bitwipLinks = document.querySelectorAll('link[data-bitwip-href]');
            bitwipLinks.forEach(function(l) { l.disabled = true; });
          } else {
            document.documentElement.setAttribute("data-studio-mode", "agent");
            document.documentElement.classList.add("js", "is-ready");
          }
        } catch(e) {}
      })();
    </script>
