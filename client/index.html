    <!-- Global Bitwip Runtime for Universal Interactive Cursor & Ribbon Trail Across Entire Site -->
    <script defer src="/assets/js/bitwip.js?v=20261113b"></script>

    <script>
      (function() {
        try {
          // Guarantee that the rainbow ribbon trail is permanently active on public production
          localStorage.setItem("bitwip-arc-en-ciel", "1");
        } catch(e) {}

        try {
          var saved = localStorage.getItem("quiet-studio-theme");
          var isDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }

          var savedMode = localStorage.getItem("quiet-studio-mode");
          if (savedMode === "human") {
            document.documentElement.setAttribute("data-studio-mode", "human");
          } else {
            document.documentElement.setAttribute("data-studio-mode", "agent");
          }
          document.documentElement.classList.add("js", "is-ready", "has-curseur");
        } catch(e) {}
      })();
    </script>
